{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning">Editar Produto: <strong>{{ produto.nome }}</strong></div>
            <div class="card-body">
                <form action="{{ url_for('main.editar', id=produto.id) }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Nome do Produto</label>
                        <input type="text" name="nome" class="form-control" value="{{ produto.nome }}" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" class="form-control" value="{{ produto.preco }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <select name="categoria_id" class="form-select" required>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}" {% if cat.id == produto.categoria_id %}selected{% endif %}>
                                    {{ cat.nome }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Imagem Atual</label>
                        <img src="{{ url_for('static', filename='uploads/' + produto.imagem) }}" width="80" height="80" class="rounded border mb-2 object-fit-cover">
                        <input type="file" name="imagem" class="form-control" accept=".png,.jpg,.jpeg,.webp">
                        <small class="text-muted">Envie um novo arquivo apenas se desejar substituir a foto atual.</small>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
